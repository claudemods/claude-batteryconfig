<svg xmlns="http://www.w3.org/2000/svg" width="460" height="640" viewBox="0 0 460 640" font-family="'Noto Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <title>claude-batteryconfig v1.0 popup</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa468"/><stop offset="1" stop-color="#e0662c"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="24" y="124" width="412" height="22" rx="11"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="0.500" y="0.500" width="459" height="639" rx="12" fill="#232629" stroke="#4d4d4d"/>

  <!-- header -->
  <g transform="translate(24 20) scale(0.750)">
    <rect x="5" y="10" width="49" height="29" rx="7" fill="#2b2f38" stroke="#ff8a4c" stroke-width="3"/>
    <rect x="54" y="19" width="5" height="11" rx="2" fill="#ff8a4c"/>
    <rect x="10" y="15" width="31" height="19" rx="4" fill="url(#fill)"/>
    <polygon points="29,16 21,26.500 27,26.500 25,34 35,23 29,23" fill="#fff"/>
    <line x1="9" y1="50" x2="55" y2="50" stroke="#8a93a3" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="44" y2="50" stroke="#ff8a4c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="50" r="5" fill="#fff" stroke="#ff8a4c" stroke-width="2.500"/>
    <circle cx="44" cy="50" r="5" fill="#fff" stroke="#ff8a4c" stroke-width="2.500"/>
  </g>
  <text x="84" y="44" fill="#eff0f1" font-size="18" font-weight="700">claude-batteryconfig</text>
  <text x="84" y="63" fill="#eff0f1" font-size="12" opacity="0.65">v1.0 · BAT0</text>
  <g transform="translate(418 30)" fill="none" stroke="#eff0f1" stroke-width="2" stroke-linecap="round">
    <path d="M14 7a7 7 0 1 0 1.500 7"/><polyline points="14,1 14,7 8,7"/>
  </g>

  <!-- battery bar -->
  <text x="24" y="114" fill="#eff0f1" font-size="13" font-weight="700">Battery 30%</text>
  <text x="436" y="114" fill="#eff0f1" font-size="12" opacity="0.65" text-anchor="end">Charging</text>
  <rect x="24" y="124" width="412" height="22" rx="11" fill="#2a2e32" stroke="#5a5f63"/>
  <g clip-path="url(#barclip)">
    <rect x="65.200" y="124" width="288.400" height="22" fill="#3daee9" opacity="0.28"/>
    <rect x="24" y="124" width="123.600" height="22" fill="#27ae60" opacity="0.9"/>
  </g>
  <rect x="63.700" y="121" width="3" height="28" rx="1" fill="#eff0f1"/>
  <rect x="352.100" y="121" width="3" height="28" rx="1" fill="#eff0f1"/>
  <text x="24" y="168" fill="#eff0f1" font-size="11" opacity="0.65">Charging resumes below 10% and stops at 80%</text>

  <!-- start row -->
  <text x="24" y="206" fill="#eff0f1" font-size="13" font-weight="700">Start charging below</text>
  <text x="24" y="223" fill="#eff0f1" font-size="11" opacity="0.65">Emulated by a background service</text>
  <text x="24" y="237" fill="#eff0f1" font-size="11" opacity="0.65">(this firmware only offers a stop limit).</text>
  <rect x="330" y="196" width="78" height="32" rx="5" fill="#31363b" stroke="#5a5f63"/>
  <text x="358" y="217" fill="#eff0f1" font-size="14" text-anchor="middle">10</text>
  <path d="M385 207l4-4 4 4M385 217l4 4 4-4" fill="none" stroke="#eff0f1" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="418" y="217" fill="#eff0f1" font-size="13">%</text>
  <rect x="24" y="258" width="412" height="4" rx="2" fill="#4d5156"/>
  <rect x="24" y="258" width="52" height="4" rx="2" fill="#3daee9"/>
  <circle cx="76" cy="260" r="9" fill="#eff0f1" stroke="#3daee9" stroke-width="2"/>

  <!-- stop row -->
  <text x="24" y="304" fill="#eff0f1" font-size="13" font-weight="700">Stop charging at</text>
  <text x="24" y="321" fill="#eff0f1" font-size="11" opacity="0.65">Charging halts when the battery reaches this level.</text>
  <rect x="330" y="292" width="78" height="32" rx="5" fill="#31363b" stroke="#5a5f63"/>
  <text x="358" y="313" fill="#eff0f1" font-size="14" text-anchor="middle">80</text>
  <path d="M385 303l4-4 4 4M385 313l4 4 4-4" fill="none" stroke="#eff0f1" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="418" y="313" fill="#eff0f1" font-size="13">%</text>
  <rect x="24" y="352" width="412" height="4" rx="2" fill="#4d5156"/>
  <rect x="24" y="352" width="309" height="4" rx="2" fill="#3daee9"/>
  <circle cx="333" cy="354" r="9" fill="#eff0f1" stroke="#3daee9" stroke-width="2"/>

  <!-- presets -->
  <text x="24" y="379" fill="#eff0f1" font-size="10" opacity="0.65">PRESETS · resume below → stop at</text>
  <g font-size="12" fill="#eff0f1" text-anchor="middle">
    <rect x="24" y="388" width="124" height="30" rx="5" fill="#31363b" stroke="#5a5f63"/>
    <text x="86" y="407">Lifespan 30→80</text>
    <rect x="156" y="388" width="116" height="30" rx="5" fill="#31363b" stroke="#5a5f63"/>
    <text x="214" y="407">Daily 20→90</text>
    <rect x="280" y="388" width="112" height="30" rx="5" fill="#31363b" stroke="#5a5f63"/>
    <text x="336" y="407">Full 20→100</text>
    <rect x="24" y="426" width="84" height="30" rx="5" fill="#31363b" stroke="#5a5f63"/>
    <text x="66" y="445">No limit</text>
  </g>

  <!-- persist checkbox -->
  <rect x="24" y="474" width="18" height="18" rx="3" fill="#3daee9"/>
  <path d="M28 483l4 4 8-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="488" fill="#eff0f1" font-size="13">Keep after reboot and resume</text>

  <!-- applied message -->
  <rect x="24" y="512" width="412" height="44" rx="5" fill="#27ae60" fill-opacity="0.18" stroke="#27ae60"/>
  <rect x="38" y="523" width="22" height="22" rx="4" fill="#27ae60"/>
  <path d="M43 534l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="539" fill="#eff0f1" font-size="13">Applied: 10% → 80%</text>

  <!-- actions -->
  <rect x="200" y="584" width="96" height="34" rx="5" fill="#31363b" stroke="#5a5f63"/>
  <text x="248" y="606" fill="#eff0f1" font-size="13" text-anchor="middle">Reset</text>
  <rect x="304" y="584" width="132" height="34" rx="5" fill="#3daee9"/>
  <text x="370" y="606" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Apply (admin)</text>
</svg>
